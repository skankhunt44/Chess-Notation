<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phone Chess Tracker (PoC)</title>

  <!-- chessboard.js (served locally in /chessboardjs-1.0.0) -->
  <link rel="stylesheet" href="/chessboardjs-1.0.0/css/chessboard-1.0.0.min.css">
  <script src="/chessboardjs-1.0.0/js/jquery-3.7.1.min.js"></script>
  <script src="/chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>

  <style>
    :root { --w: 400px; }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;background:#fafafa;color:#222}
    h2{margin:4px 0 0}
    #cam{display:block;max-width:100%;width:420px;background:#000;border-radius:8px}
    #controls{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;justify-content:center}
    button{padding:8px 12px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    #board{width:var(--w);margin-top:6px}
    #status{margin-top:4px;color:#444;text-align:center;min-height:1.4em}
    #historyWrap{width:var(--w);max-width:100%}
    #history{white-space:pre-wrap;margin-top:6px;width:100%;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:8px;min-height:52px}
    #warp{max-width:100%;border:1px solid #ddd;margin-top:8px;border-radius:8px}
    #grid{margin-top:8px}
    #grid button{width:40px;height:40px}
    .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .pill{font-size:.86rem;padding:4px 8px;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#334155}
    .spacer{height:6px}
  </style>
</head>

<body>
  <h2>Phone Chess Tracker (PoC)</h2>

  <video id="cam" autoplay muted playsinline></video>

  <div id="controls" class="row">
    <button id="enableCam">Enable camera</button>
    <button id="calib" disabled>Calibrate board</button>
    <!-- <button id="btnEmpty" disabled>Capture empty</button>
    <button id="btnTeachW" disabled>Teach white</button>
    <button id="btnTeachB" disabled>Teach black</button> -->
    <button id="btnSample" disabled>Capture sample</button>

    <!-- Game lifecycle controls -->
    <span class="spacer" style="flex-basis:100%"></span>
    <button id="resignW" disabled>White resigns</button>
    <button id="resignB" disabled>Black resigns</button>
    <button id="agreeDraw" disabled>Agree draw</button>
    <button id="claimDraw" disabled>Claim draw</button>
    <button id="resetGame">New game</button>
  </div>

  <!-- Labeling preview (optional flow you already had) -->
  <canvas id="warp" width="800" height="800" style="display:none"></canvas>
  <div id="grid" style="display:none"></div>

  <div id="board"></div>
  <div id="status">Waiting for camera …</div>

  <div id="historyWrap">
    <div class="pill" id="flags" style="display:none"></div>
    <pre id="history"></pre>
  </div>

  <button id="analyzeBtn" disabled>Analyze with Stockfish</button>
  <span class="spacer" style="flex-basis:100%"></span>
  <div id="analysis" class="pill" style="display:none"></div>
  <pre id="analysisTable" style="width:var(--w); max-width:100%; white-space:pre-wrap"></pre>


  <script>
  // ---------- elements ----------
  const statusEl   = document.getElementById('status');
  const flagsEl    = document.getElementById('flags');
  const videoEl    = document.getElementById('cam');
  const historyEl  = document.getElementById('history');

  const enableBtn  = document.getElementById('enableCam');
  const calibBtn   = document.getElementById('calib');
  // const btnEmpty   = document.getElementById('btnEmpty');
  // const btnTeachW  = document.getElementById('btnTeachW');
  // const btnTeachB  = document.getElementById('btnTeachB');
  const btnSample  = document.getElementById('btnSample');
  const warpCanvas = document.getElementById('warp');
  const gridDiv    = document.getElementById('grid');

  const resignWBtn = document.getElementById('resignW');
  const resignBBtn = document.getElementById('resignB');
  const agreeBtn   = document.getElementById('agreeDraw');
  const claimBtn   = document.getElementById('claimDraw');
  const resetBtn   = document.getElementById('resetGame');

  // ---------- chessboard.js ----------
  const board = Chessboard('board', {
    position   : 'start',
    draggable  : false,
    pieceTheme : '/chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png'
  });

  // ---------- state ----------
  let ws, stream, track, step = 0;
  let curLabels = null, curWarp = null;

  // Backpressure-aware sender state
  let inFlight = false;
  let pendingBlob = null;
  const TARGET_FPS = 6;                       // tune 3–10 based on server speed
  const MIN_SEND_MS = 1000 / TARGET_FPS;
  let lastSentAt = 0;

  // ---------- helpers ----------
  const wsURL = () => (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';

  const blobToB64 = (blob) => new Promise(r => {
    const fr = new FileReader();
    fr.onload = () => r(fr.result);
    fr.readAsDataURL(blob);
  });

  const isSecure = () =>
    window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost';

  function uciToDashed(uci) {
    // "e2e4" -> "e2-e4"
    if (!uci || uci.length < 4) return uci;
    return `${uci.slice(0,2)}-${uci.slice(2,4)}`;
  }

  function setFlags(state) {
    if (!state) { flagsEl.style.display = 'none'; return; }
    const pills = [];
    if (state.check) pills.push('Checkmate');
    if (state.threefold_claimable) pills.push('Threefold claimable');
    if (state.fifty_moves_claimable) pills.push('50-move claimable');
    if (state.fivefold_repetition) pills.push('Auto-draw (5×)');
    if (state.seventyfive_moves) pills.push('Auto-draw (75-move)');
    if (state.stalemate) pills.push('Stalemate');
    if (state.insufficient_material) pills.push('Insufficient material');

    if (pills.length) {
      flagsEl.textContent = pills.join(' · ');
      flagsEl.style.display = '';
    } else {
      flagsEl.style.display = 'none';
    }
  }

  // capture frame (downscale + compress)
  async function grabFrame (videoTrack, canvas) {
    if ('ImageCapture' in window) {
      try {
        const cap = new ImageCapture(videoTrack);
        if (cap.grabFrame) return cap.grabFrame();  // ImageBitmap at native res
      } catch { /* fallback */ }
    }
    canvas = canvas || (grabFrame._c ||= document.createElement('canvas'));
    const srcW = videoEl.videoWidth  || 640;
    const srcH = videoEl.videoHeight || 480;
    const MAX_W = 960;                        // cap width to reduce payload size
    const scale = Math.min(1, MAX_W / srcW);
    canvas.width  = Math.round(srcW * scale);
    canvas.height = Math.round(srcH * scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    return new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.65));
  }

  async function frameToBlob (frame) {
    if (frame instanceof Blob) return frame;
    if (frame && frame.convertToBlob) return frame.convertToBlob();
    const c = document.createElement('canvas');
    c.width = frame.width; c.height = frame.height;
    c.getContext('2d').drawImage(frame,0,0);
    return new Promise(r => c.toBlob(r,'image/jpeg',0.65));
  }

  async function requestCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = 'Camera API not supported in this browser.';
      return;
    }
    if (!isSecure()) {
      statusEl.textContent = 'Open this page over HTTPS (or localhost). Mobile browsers block camera on HTTP.';
      return;
    }
    try {
      const constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = stream;

      await new Promise(res => {
        if (videoEl.readyState >= 2) return res();
        videoEl.onloadeddata = res;
      });

      track = stream.getVideoTracks()[0];
      statusEl.textContent = 'Camera ready. Point at the board.';
      calibBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = `Camera error: ${err.name} – ${err.message}`;
      console.error(err);
    }
  }

  async function ensureCamera() {
    if (track) return true;
    await requestCamera();
    return !!track;
  }

  function enableEndControls(on) {
    resignWBtn.disabled = !on;
    resignBBtn.disabled = !on;
    agreeBtn.disabled   = !on;
    // claimBtn toggled dynamically based on server flags
  }

  function closeWS(keepCamera = true) {
    try { ws && ws.readyState === 1 && ws.close(); } catch {}
    ws = null;
    inFlight = false;
    pendingBlob = null;

    if (!keepCamera) {
      try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
      track = null;
      stream = null;
      videoEl.srcObject = null;
    }
}

  // --- Backpressure-aware sender (keeps only the newest frame; 1 in-flight) ---
  async function refreshPending() {
    if (!track) return;
    const fr   = await grabFrame(track);
    const blob = await frameToBlob(fr);
    pendingBlob = blob;               // overwrite older pending frame
  }

  function pump() {
    if (!ws || ws.readyState !== 1 || !track) return;
    const now = performance.now();

    // refresh the pending frame opportunistically
    refreshPending().then(() => {
      if (!inFlight && pendingBlob && (now - lastSentAt) >= MIN_SEND_MS) {
        inFlight = true;
        lastSentAt = performance.now();

        // still using base64 text frames
        blobToB64(pendingBlob).then(b64 => {
          pendingBlob = null;
          try { ws.send(b64); } catch {}
        });
      }
      requestAnimationFrame(pump);
    });
  }

  async function startWS () {
    ws = new WebSocket(wsURL());
    ws.onopen  = () => {
      statusEl.textContent = 'Connected – tracking moves.';
      inFlight = false; pendingBlob = null; lastSentAt = 0;
      enableEndControls(true);
      pump();
    };
    ws.onclose = (e) => {
      console.log('WS close', e.code, e.reason);
      statusEl.textContent = `WebSocket closed (code ${e.code})`;
      enableEndControls(false);
      claimBtn.disabled = true;
    };
    ws.onerror = (e) => console.error('WS error', e);

    ws.onmessage = ({data}) => {
      const msg = JSON.parse(data);
      if (msg.type === 'ping') return;  // ignore server heartbeat

      if (msg.ms !== undefined) statusEl.textContent = `Proc ${msg.ms} ms`;

      // Prefer authoritative FEN for rendering (promotions, castling, etc.)
      if (msg.fen) {
        board.position(msg.fen, true);
      } else if (msg.move) {
        // Fallback if no FEN (non-promotion only)
        if (msg.move.length === 4) board.move(uciToDashed(msg.move));
      }

      if (msg.history) {
        historyEl.textContent = msg.history.join(' ');
        enableAnalyzeIfMoves();            // ← enable the button once moves exist
      }
      if (msg.err) statusEl.textContent = msg.err;

      // State flags (check, claimables, game over)
      if (msg.state) {
        setFlags(msg.state);

        // Enable "Claim draw" only if claimable (threefold or fifty-move)
        const claimable = !!(msg.state.threefold_claimable || msg.state.fifty_moves_claimable);
        claimBtn.disabled = !claimable;

        if (msg.state.game_over) {
          const term = msg.state.termination || 'GAME_OVER';
          const res  = msg.state.result || '';
          statusEl.textContent = `Game over (${term}): ${res}`;
          closeWS(true);
          enableEndControls(false);
          claimBtn.disabled = true;
        } else if (msg.state.check) {
          // Only show "Check!" if not game over
          statusEl.textContent = 'Check!';
        }
      } else {
        claimBtn.disabled = true;
        setFlags(null);
      }

      inFlight = false;                 // ACK: allow next frame
    };
  }

  async function calibrate () {
    if (!(await ensureCamera())) return;
    const fr   = await grabFrame(track);
    const blob = await frameToBlob(fr);
    const b64  = await blobToB64(blob);
    if (step === 0) {
      statusEl.textContent = 'Calibrating…';
      const res = await fetch('/calibrate', { method:'POST', body:b64 });
      if (!res.ok) {
        statusEl.textContent = 'Calibration failed – show the whole board & retry';
        return;
      }
      step = 1;
      statusEl.textContent = 'Corners found. Set up the board and press again.';
      calibBtn.textContent = 'Start tracking';
      btnSample.disabled = false; // ← enable sample capture right away
    } else {
      calibBtn.disabled = true;
      startWS();
    }
  }

  async function postB64(url){
    if (!(await ensureCamera())) throw new Error('No camera');
    const fr = await grabFrame(track);
    const blob = await frameToBlob(fr);
    const b64  = await blobToB64(blob);
    const res  = await fetch(url, {method:'POST', body:b64});
    if(!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function renderGrid(){
    gridDiv.innerHTML = '';
    gridDiv.style.display = 'grid';
    gridDiv.style.gridTemplateColumns = 'repeat(8, 40px)';
    gridDiv.style.gap = '2px';
    curLabels.forEach((lab,i)=>{
      const cell = document.createElement('button');
      cell.textContent = lab;
      cell.onclick = ()=>{
        const order = ['E','W','B'];
        cell.textContent = curLabels[i] = order[(order.indexOf(curLabels[i])+1)%3];
      };
      gridDiv.appendChild(cell);
    });
    const save = document.createElement('button');
    save.textContent = 'Save sample';
    save.style.gridColumn = 'span 8';
    save.onclick = async ()=>{
      const res = await fetch('/save-sample', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({labels: curLabels, image_b64: curWarp})
      });
      statusEl.textContent = res.ok ? 'Saved sample.' : 'Save failed.';
    };
    gridDiv.appendChild(save);
  }

  // ---------- resign / draw / reset ----------
  async function postJSON(url, opts={}) {
    const res = await fetch(url, { method:'POST', ...opts });
    const body = await res.json().catch(()=> ({}));
    if (!res.ok) throw new Error(body.detail || JSON.stringify(body));
    return body;
  }

  async function resign(color) {
    try {
      const body = await postJSON(`/resign/${color}`);
      if (body.fen) board.position(body.fen, false);
      if (body.history) historyEl.textContent = body.history.join(' ');
      statusEl.textContent = `Game over (${body.state?.termination || 'RESIGNATION'}): ${body.state?.result || ''}`;
      closeWS(true);
      enableEndControls(false);
      claimBtn.disabled = true;
      setFlags(body.state || null);
    } catch (e) {
      statusEl.textContent = `Resign failed: ${e.message}`;
    }
  }

  async function agreeDraw() {
    try {
      const body = await postJSON('/draw/agree');
      if (body.fen) board.position(body.fen, false);
      if (body.history) historyEl.textContent = body.history.join(' ');
      statusEl.textContent = `Game over (${body.state?.termination || 'DRAW'}): ${body.state?.result || ''}`;
      closeWS(true);
      enableEndControls(false);
      claimBtn.disabled = true;
      setFlags(body.state || null);
    } catch (e) {
      statusEl.textContent = `Agree draw failed: ${e.message}`;
    }
  }

  async function claimDraw() {
    try {
      const body = await postJSON('/draw/claim');
      if (body.fen) board.position(body.fen, false);
      if (body.history) historyEl.textContent = body.history.join(' ');
      statusEl.textContent = `Game over (${body.state?.termination || 'DRAW'}): ${body.state?.result || ''}`;
      closeWS(true);
      enableEndControls(false);
      claimBtn.disabled = true;
      setFlags(body.state || null);
    } catch (e) {
      statusEl.textContent = `Claim failed: ${e.message}`;
    }
  }

  async function resetGame() {
    try {
      const body = await postJSON('/reset');
      board.position(body.fen || 'start', false);
      historyEl.textContent = (body.history || []).join(' ');
      enableAnalyzeIfMoves(); 
      statusEl.textContent = 'New game — tracking resumed.';
      setFlags(null);
      // Keep calibration; user can hit the button to (re)start tracking
      calibBtn.textContent = 'Start tracking';
    // If camera is live, restart WS so buttons get enabled in ws.onopen
      if (track && track.readyState === 'live') {
        startWS();
      } else {
        statusEl.textContent = 'New game. Start tracking when ready.';
      }
      claimBtn.disabled = true;
    } catch (e) {
      statusEl.textContent = `Reset failed: ${e.message}`;
    }
  }

  // ---------- wire up UI ----------
  enableBtn.addEventListener('click', requestCamera);
  calibBtn.addEventListener('click', calibrate);

  // btnEmpty.onclick = async ()=>{
  //   await postB64('/capture-empty');
  //   statusEl.textContent = 'Empty captured. Teach colors.';
  //   btnTeachW.disabled = btnTeachB.disabled = false;
  // };

  // btnTeachW.onclick = ()=> postB64('/teach-color/white').then(()=> {
  //   statusEl.textContent='White learned.';
  // }).catch(e => statusEl.textContent = e.message);

  // btnTeachB.onclick = ()=> postB64('/teach-color/black').then(()=> {
  //   statusEl.textContent='Black learned. Ready to label!';
  //   btnSample.disabled = false;
  // }).catch(e => statusEl.textContent = e.message);

  btnSample.onclick = async ()=>{
    try {
      const {labels, warp_png} = await postB64('/propose-labels');
      curLabels = labels; curWarp = warp_png;
      const img = new Image();
      img.onload = ()=>{
        const ctx = warpCanvas.getContext('2d');
        ctx.clearRect(0,0,800,800);
        ctx.drawImage(img,0,0,800,800);
        warpCanvas.style.display = 'block';
        renderGrid();
      };
      img.src = 'data:image/png;base64,'+curWarp;
    } catch (e) {
      statusEl.textContent = e.message;
    }
  };

  resignWBtn.onclick = () => resign('white');
  resignBBtn.onclick = () => resign('black');
  agreeBtn.onclick   = agreeDraw;
  claimBtn.onclick   = claimDraw;
  resetBtn.onclick   = resetGame;

  // ---------- startup tip ----------
  if (!isSecure()) {
    statusEl.textContent = 'Tip: open this over HTTPS (ngrok/cloudflared) or localhost so the camera prompt appears.';
  }
  </script>



  <script>
  const analyzeBtn = document.getElementById('analyzeBtn');
  const analysisEl = document.getElementById('analysis');
  const analysisTable = document.getElementById('analysisTable');
  document.addEventListener('DOMContentLoaded', enableAnalyzeIfMoves);

  function enableAnalyzeIfMoves() {
    const hasMoves = (historyEl.textContent.trim().length > 0);
    analyzeBtn.disabled = !hasMoves;
  }

  analyzeBtn.onclick = async ()=>{

    window.open('/analysis.html');
  };
</script>

</body>
</html>
