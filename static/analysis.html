<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Analysis • Chess Tracker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <!-- chessboard.js (served locally) -->
  <link rel="stylesheet" href="/chessboardjs-1.0.0/css/chessboard-1.0.0.min.css" />
  <script src="/chessboardjs-1.0.0/js/jquery-3.7.1.min.js"></script>
  <script src="/chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    :root{
      --primary:#6366f1; --primary-dark:#4f46e5; --secondary:#8b5cf6; --accent:#06b6d4;
      --glass:rgba(255,255,255,.08); --glass-border:rgba(255,255,255,.12);
      --text:#fff; --muted:rgba(255,255,255,.7);
      --board-size:min(86vw, 420px);
      --card-radius:20px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(135deg,#0f0f23 0%,#1a1a2e 25%,#16213e 50%,#0f3460 100%);
      color:var(--text); min-height:100vh; overflow-x:hidden;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      padding-bottom:env(safe-area-inset-bottom);
    }
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(circle at 20% 80%, rgba(99,102,241,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(139,92,246,.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(6,182,212,.08) 0%, transparent 50%);
    }

    .container{
      position:relative; z-index:1;
      max-width:1100px; margin:0 auto; padding:calc(18px + env(safe-area-inset-top)) 16px 20px;
      display:grid; gap:16px; grid-template-columns:1fr;
    }
    @media (min-width:980px){
      .container{ grid-template-columns:minmax(320px,520px) 1fr; align-items:start; }
      :root{ --board-size:440px; }
    }

    .header{text-align:center}
    .title{
      font-size:30px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px;
      background:linear-gradient(135deg,#fff 0%,#a8a8a8 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .subtitle{ color:var(--muted); font-size:14px; }

    .card{
      background:var(--glass); border:1px solid var(--glass-border);
      border-radius:var(--card-radius); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    }
    .section{ padding:18px; }

    /* Back button like sample.html */
    .back-nav{ position:fixed; top:20px; left:20px; z-index:10; }
    .back-btn{
      background:var(--glass); border:1px solid var(--glass-border);
      border-radius:12px; color:#fff; padding:8px 12px; font-weight:600; cursor:pointer;
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); display:inline-flex; gap:6px;
      transition:all .2s cubic-bezier(.4,0,.2,1);
    }
    .back-btn:hover{ transform:translateY(-1px); }

    .btn{
      background:var(--glass); border:1px solid var(--glass-border); border-radius:12px;
      padding:12px 16px; color:#fff; font-weight:600; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px; transition:.2s;
    }
    .btn:hover{ transform:translateY(-1px); background:rgba(255,255,255,.12) }
    .btn:disabled{ opacity:.45; cursor:not-allowed }
    .btn-primary{ background:linear-gradient(135deg,var(--primary),var(--primary-dark)); border:none; }
    .btn-group{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }

    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      border:1px solid var(--glass-border); background:rgba(255,255,255,.10); font-size:13px; font-weight:600;
    }
    .meta{ color:var(--muted); font-size:12px; }

    /* Board + overlay + eval bar */
    .board-row{ display:flex; gap:14px; align-items:stretch; justify-content:center; }
    .board-shell{
      width:var(--board-size); position:relative; border-radius:18px; overflow:hidden;
      box-shadow:0 20px 40px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.08);
    }
    #board{ width:100%; background:transparent; } /* chessboard.js sets height */
    #board > div{ border-radius:18px; } /* clip inner corners */
    #overlay{ position:absolute; inset:0; pointer-events:none; } /* arrow canvas */

    .evalbar{
      position:relative; width:22px; flex:0 0 22px; border-radius:12px; overflow:hidden;
      border:1px solid var(--glass-border); background:#111; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
    }
    /* Black on top, White at bottom */
    .eval-white{ position:absolute; bottom:0; left:0; right:0; height:50%; background:#fff; transition:height .25s ease; }
    .eval-black{ position:absolute; top:0;    left:0; right:0; height:50%; background:#000; transition:height .25s ease; }
    .eval-notch{ position:absolute; left:-6px; right:-6px; height:2px; background:rgba(255,255,255,.6); transition:bottom .25s ease; }
    .eval-label{
      position:absolute; right:28px; transform:translateY(50%);
      padding:4px 8px; font-size:12px; font-weight:700; border-radius:8px;
      background:rgba(255,255,255,.12); border:1px solid var(--glass-border);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      white-space:nowrap;
    }

    .table-wrap{ overflow:auto; -webkit-overflow-scrolling:touch; }
    table{ width:100%; border-collapse:collapse; font-size:14px; }
    th,td{ padding:10px 10px; border-bottom:1px solid var(--glass-border); }
    thead th{ position:sticky; top:0; background:rgba(0,0,0,.18); backdrop-filter:blur(6px); }
    tr{ cursor:pointer; }
    tr:hover{ background:rgba(255,255,255,.08); }
    .tag{ font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--glass-border); display:inline-block; }
    .best{ background:#dcfce7; color:#166534; border-color:#86efac; font-weight:700; }
    .good{ background:#ecfeff; color:#155e75; border-color:#a5f3fc; }
    .inaccuracy{ background:#fff7ed; color:#9a3412; border-color:#fed7aa; }
    .mistake{ background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .blunder{ background:#fee2e2; color:#7f1d1d; border-color:#fca5a5; font-weight:800; }

    @media (max-width:560px){
      th.hide-sm, td.hide-sm{ display:none; }
    }
  </style>
</head>
<body>
  <!-- Back like sample.html -->
  <div class="back-nav">
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <div class="container">
    <div class="header" style="grid-column:1 / -1;">
      <h1 class="title">Game Analysis</h1>
      <p class="subtitle">Step through moves, see engine evals, and review mistakes</p>
    </div>

    <!-- Left column -->
    <div class="card">
      <div class="section">
        <div class="board-row">
          <!-- Board + overlay -->
          <div class="board-shell" id="boardShell">
            <div id="board"></div>
            <canvas id="overlay"></canvas>
          </div>

          <!-- Eval bar (BLACK top / WHITE bottom) -->
          <div class="evalbar" aria-label="Engine evaluation bar (Black at top, White at bottom)">
            <div class="eval-black" id="evalBlack"></div>
            <div class="eval-white" id="evalWhite"></div>
            <div class="eval-notch" id="evalNotch" style="bottom:50%"></div>
            <div class="eval-label" id="evalBubble" style="bottom:50%">—</div>
          </div>
        </div>

        <div class="btn-group" style="margin-top:14px;">
          <button id="btnStart" class="btn">⏮ Start</button>
          <button id="btnPrev" class="btn">◀︎ Prev</button>
          <button id="btnPlay" class="btn btn-primary">▶︎ Play</button>
          <button id="btnNext" class="btn">Next ▶︎</button>
          <button id="btnEnd" class="btn">End ⏭</button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:10px;">
          <span class="pill" id="status">Loading…</span>
          <a id="downloadPGN" class="pill" style="display:none" download="analysis.pgn">⬇️ Download PGN</a>
        </div>

        <div class="meta" style="text-align:center; margin-top:10px;">
          Tips: ← / → to step · Space to play/pause
        </div>

        <div style="text-align:center; margin-top:10px; font-variant-numeric: tabular-nums;">
          <strong>Position:</strong> <span id="posLabel">0 / 0</span> ·
          <strong>Turn:</strong> <span id="turnLabel">-</span> ·
          <strong>Eval:</strong> <span id="evalLabel">-</span> ·
          <strong>Δ:</strong> <span id="deltaLabel">-</span> ·
          <strong>Best:</strong> <span id="bestLabel">-</span>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px;">
          <span class="pill" id="summaryPill" style="display:none"></span>
          <span class="pill" id="resultPill" style="display:none"></span>
        </div>
      </div>
    </div>

    <!-- Right column: moves table -->
    <div class="card">
      <div class="section">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <strong>Moves</strong>
          <span class="meta" id="acplPill" style="display:none;"></span>
        </div>
        <div class="table-wrap">
          <table id="movesTable">
            <thead>
              <tr>
                <th>#</th><th class="hide-sm">Side</th><th>Move</th><th>Eval</th><th class="hide-sm">Δ</th><th class="hide-sm">Best</th><th>Tag</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- chess.js (ESM). Adjust path if needed -->
  <script type="module">
    import { Chess } from '/vendor/chess.js?v=2';

    (function(){
      const MAX_PAWN = 6; // clamp for eval bar scaling (±6 pawns)
      const board = Chessboard('board', {
        position   : 'start',
        orientation: 'white',  // board stays white-at-bottom
        draggable  : false,
        pieceTheme : '/chessboardjs-1.0.0/img/chesspieces/wikipedia/{piece}.png'
      });

      // --- Elements ---
      const statusEl    = document.getElementById('status');
      const summaryPill = document.getElementById('summaryPill');
      const resultPill  = document.getElementById('resultPill');
      const acplPill    = document.getElementById('acplPill');
      const downloadPGN = document.getElementById('downloadPGN');

      const posLabel   = document.getElementById('posLabel');
      const turnLabel  = document.getElementById('turnLabel');
      const evalLabel  = document.getElementById('evalLabel');
      const deltaLabel = document.getElementById('deltaLabel');
      const bestLabel  = document.getElementById('bestLabel');

      const evalWhite  = document.getElementById('evalWhite');
      const evalBlack  = document.getElementById('evalBlack');
      const evalNotch  = document.getElementById('evalNotch');
      const evalBubble = document.getElementById('evalBubble');

      const tBody = document.querySelector('#movesTable tbody');

      const btnStart = document.getElementById('btnStart');
      const btnPrev  = document.getElementById('btnPrev');
      const btnPlay  = document.getElementById('btnPlay');
      const btnNext  = document.getElementById('btnNext');
      const btnEnd   = document.getElementById('btnEnd');

      // Overlay canvas for best-move arrow
      const overlay = document.getElementById('overlay');
      const boardShell = document.getElementById('boardShell');

      // --- State ---
      let analysis = null;
      let positions = [];
      let cur = 0;
      let timer = null;

      function setButtons(on){ [btnStart,btnPrev,btnNext,btnEnd,btnPlay].forEach(b=> b.disabled = !on); }

      // ------ Arrow overlay helpers ------
      function syncOverlaySize(){
        const rect = boardShell.getBoundingClientRect();
        overlay.width  = Math.round(rect.width);
        overlay.height = Math.round(rect.height);
      }
      function squareCenter(sq){
        // Get DOM square and compute center relative to overlay
        const el = document.querySelector(`#board .square-${sq}`);
        if (!el) return null;
        const a = el.getBoundingClientRect();
        const b = overlay.getBoundingClientRect();
        return { x: a.left - b.left + a.width/2, y: a.top - b.top + a.height/2 };
      }
      function drawArrow(fromSq, toSq){
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
        const A = squareCenter(fromSq), B = squareCenter(toSq);
        if (!A || !B) return;

        // Shaft
        ctx.lineWidth = Math.max(4, overlay.width * 0.01);
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(99,102,241,0.95)'; // primary
        ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();

        // Arrow head
        const headLen = Math.max(12, overlay.width * 0.035);
        const ang = Math.atan2(B.y - A.y, B.x - A.x);
        ctx.beginPath();
        ctx.moveTo(B.x, B.y);
        ctx.lineTo(B.x - headLen * Math.cos(ang - Math.PI/6), B.y - headLen * Math.sin(ang - Math.PI/6));
        ctx.moveTo(B.x, B.y);
        ctx.lineTo(B.x - headLen * Math.cos(ang + Math.PI/6), B.y - headLen * Math.sin(ang + Math.PI/6));
        ctx.stroke();
      }
      function clearArrow(){
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
      }
      window.addEventListener('resize', ()=>{ syncOverlaySize(); // keep arrow crisp
        // redraw current best arrow after resize
        if (analysis) drawBestArrowForIndex(cur);
      });

      // ------ Highlight helpers ------
      function clearHighlights(){
        document.querySelectorAll('#board [class*=square-]').forEach(el=>{
          el.style.outline = ''; el.style.boxShadow='';
        });
      }
      function getSquareEl(sq){ return document.querySelector(`#board .square-${sq}`); }
      function mark(el, color){
        if (!el) return;
        el.style.outline = `3px solid ${color}`;
        el.style.boxShadow = 'inset 0 0 0 2px #fff';
      }

      function highlightForIndex(i){
        clearHighlights();
        // previous actual move (orange)
        if (i > 0) {
          const gPrev = new Chess(positions[i-1]);
          const san   = analysis.moves[i-1].move;
          const mv    = gPrev.move(san, {sloppy:true});
          if (mv) { mark(getSquareEl(mv.from),'rgba(245,158,11,.92)'); mark(getSquareEl(mv.to),'rgba(245,158,11,.92)'); }
        }
      }

      function drawBestArrowForIndex(i){
        clearArrow();
        if (i >= analysis.moves.length) return;
        const bestSan = analysis.moves[i].best;
        if (!bestSan) return;
        const gNow = new Chess(positions[i]);
        const mv2  = gNow.move(bestSan, {sloppy:true});
        if (mv2){
          syncOverlaySize();
          drawArrow(mv2.from, mv2.to);
        }
      }

      // ------ Info + eval bar ------
      function showInfoForIndex(i){
        posLabel.textContent = `${i} / ${analysis.moves.length}`;
        const g = new Chess(positions[i]);
        turnLabel.textContent = g.turn() === 'w' ? 'White' : 'Black';

        if (i < analysis.moves.length) {
          const r = analysis.moves[i];
          evalLabel.textContent = (r.mate_after !== null) ? `M${Math.abs(r.mate_after)}` :
            (r.eval_after == null ? '-' : (r.eval_after >= 0 ? `+${r.eval_after.toFixed(2)}` : r.eval_after.toFixed(2)));
          deltaLabel.textContent = (r.delta == null ? '-' : (r.delta >= 0 ? `+${r.delta.toFixed(2)}` : r.delta.toFixed(2)));
          bestLabel.textContent  = r.best || '-';
        } else {
          evalLabel.textContent = deltaLabel.textContent = bestLabel.textContent = '-';
        }
      }

      function whiteEvalFromResult(r){
        // Return eval from White's perspective in pawns; very large for mate.
        if (!r) return null;
        if (r.mate_after !== null) {
          const signForMover = r.mate_after > 0 ? 1 : -1;     // + => mate for mover
          const signWhite    = (r.side === 'White') ? signForMover : -signForMover; // + => mate for White
          return signWhite * (MAX_PAWN * 2); // push to extremes
        }
        if (r.eval_after == null) return null;
        let cp = r.eval_after;                 // pawns for mover
        if (r.side === 'Black') cp = -cp;      // convert to White POV
        return cp;
      }
      function evalToPct(cpWhite){
        // 0..100% where 0 = all Black (top), 100 = all White (bottom)
        if (cpWhite === null) return 50;
        const x = Math.max(-MAX_PAWN, Math.min(MAX_PAWN, cpWhite));
        return (x + MAX_PAWN) / (2 * MAX_PAWN) * 100;
      }
      function formatEvalBubble(r){
        if (!r) return '—';
        if (r.mate_after !== null){
          const wMateSign = (r.side === 'White') ? Math.sign(r.mate_after) : -Math.sign(r.mate_after);
          return wMateSign > 0 ? `M${Math.abs(r.mate_after)}` : `-M${Math.abs(r.mate_after)}`;
        }
        let cp = r.eval_after;
        if (cp == null) return '—';
        if (r.side === 'Black') cp = -cp;
        return (cp >= 0 ? `+${cp.toFixed(2)}` : cp.toFixed(2));
      }
      function updateEvalBarForIndex(i){
        const r = (i > 0) ? analysis.moves[i-1] : null; // eval AFTER previous move
        const cpW = whiteEvalFromResult(r);
        const pct = evalToPct(cpW);          // White share toward the bottom
        evalWhite.style.height = `${pct}%`;
        evalBlack.style.height = `${100 - pct}%`;
        evalNotch.style.bottom = `${pct}%`;
        evalBubble.style.bottom = `${pct}%`;
        evalBubble.textContent = formatEvalBubble(r);
      }

      // ------ Navigation ------
      function gotoIndex(i){
        i = Math.max(0, Math.min(i, positions.length - 1));
        cur = i;
        board.position(positions[i], true);
        highlightForIndex(i);
        drawBestArrowForIndex(i);
        showInfoForIndex(i);
        updateEvalBarForIndex(i);

        // Row highlight only (no auto-scroll)
        tBody.querySelectorAll('tr').forEach(tr => tr.style.background = '');
        if (i > 0) {
          const tr = document.getElementById(`row-${i-1}`);
          tr && (tr.style.background = 'rgba(124,154,255,.12)');
        }
      }
      function next(){ gotoIndex(cur + 1); }
      function prev(){ gotoIndex(cur - 1); }
      function start(){ gotoIndex(0); }
      function end(){ gotoIndex(positions.length - 1); }
      function togglePlay(){
        if (timer) { clearInterval(timer); timer = null; btnPlay.textContent = '▶︎ Play'; return; }
        btnPlay.textContent = '⏸ Pause';
        timer = setInterval(() => {
          if (cur >= positions.length - 1) { togglePlay(); return; }
          next();
        }, 600);
      }

      btnStart.onclick = start;
      btnPrev.onclick  = prev;
      btnNext.onclick  = next;
      btnEnd.onclick   = end;
      btnPlay.onclick  = togglePlay;

      window.addEventListener('keydown', (e)=>{
        if (e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
        if (e.code === 'ArrowLeft')  { prev(); e.preventDefault(); }
        if (e.code === 'ArrowRight') { next(); e.preventDefault(); }
        if (e.code === 'Space')      { togglePlay(); e.preventDefault(); }
      });

      // ------ Fetch analysis ------
      async function analyze(){
        setButtons(false);
        statusEl.textContent = 'Analyzing…';
        try{
          const res = await fetch('/analyze', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ depth: 14 })
          });
          if (!res.ok) throw new Error(await res.text());
          analysis = await res.json();

          // Build positions array
          const g = new Chess();
          positions = [g.fen()];
          (analysis.moves || []).forEach(r => {
            try { g.move(r.move, {sloppy:true}); } catch {}
            positions.push(g.fen());
          });

          // Summary + result
          const s = analysis.summary || {};
          if (s.white && s.black){
            acplPill.style.display = '';
            acplPill.textContent = `ACPL — W: ${s.acpl_white ?? '-'} · B: ${s.acpl_black ?? '-'}`;
            summaryPill.style.display = '';
            summaryPill.textContent =
              `W best/inacc/mist/bl: ${s.white.best}/${s.white.inaccuracy}/${s.white.mistake}/${s.white.blunder} · ` +
              `B best/inacc/mist/bl: ${s.black.best}/${s.black.inaccuracy}/${s.black.mistake}/${s.black.blunder}`;
          }
          resultPill.style.display = '';
          resultPill.textContent = `Result: ${s.result || '*'}`;

          downloadPGN.style.display = '';
          downloadPGN.href = URL.createObjectURL(new Blob([analysis.pgn || ''], {type:'text/plain'}));

          // Moves table
          tBody.innerHTML = '';
          (analysis.moves || []).forEach((r, idx)=>{
            const tr = document.createElement('tr');
            tr.id = `row-${idx}`;
            const td = (txt, cls='')=>{ const c = document.createElement('td'); c.textContent = txt; if (cls) c.className = cls; return c; };
            tr.appendChild(td(r.ply));
            tr.appendChild(td(r.side?.[0] || '', 'hide-sm'));
            tr.appendChild(td(r.move || ''));
            tr.appendChild(td(
              r.mate_after !== null && r.mate_after !== undefined
                ? `M${Math.abs(r.mate_after)}`
                : (r.eval_after==null ? '' : (r.eval_after>=0?`+${r.eval_after.toFixed(2)}`:`${r.eval_after.toFixed(2)}`))
            ));
            tr.appendChild(td(r.delta==null ? '' : (r.delta>=0?`+${r.delta.toFixed(2)}`:`${r.delta.toFixed(2)}`), 'hide-sm'));
            tr.appendChild(td(r.best || '', 'hide-sm'));

            const tagCell = document.createElement('td');
            const span = document.createElement('span');
            const tag = r.tag || 'good';
            span.className = `tag ${tag}`;
            span.textContent = tag;
            tagCell.appendChild(span);
            tr.appendChild(tagCell);

            tr.onclick = ()=> gotoIndex(idx);
            tBody.appendChild(tr);
          });

          statusEl.textContent = 'Done. Tap any row to jump.';
          setButtons(true);
          syncOverlaySize();
          gotoIndex(0);
        }catch(e){
          statusEl.textContent = `Analysis failed: ${e.message}`;
        }
      }

      analyze();
    })();
  </script>
</body>
</html>
